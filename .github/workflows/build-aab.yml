name: Build AAB
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find Gradle Project
        run: |
          echo "Listing files..."
          ls -la
          find . -maxdepth 3 -name "settings.gradle*" -o -name "build.gradle*"
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build AAB
        run: |
          # Agar project root me nahi, toh subfolder dhoondo
          if [ -f "./android/gradlew" ]; then
            cd android && chmod +x gradlew && ./gradlew bundleRelease
          elif [ -f "./app/build.gradle" ]; then
            chmod +x ./gradlew 2>/dev/null || true
            ./gradlew bundleRelease || gradle bundleRelease
          else
            # Try to find where settings.gradle is
            ROOT=$(find . -name "settings.gradle*" | head -1 | xargs dirname)
            echo "Found project at: $ROOT"
            cd $ROOT
            chmod +x ./gradlew 2>/dev/null || true
            ./gradlew bundleRelease || gradle bundleRelease
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            **/build/outputs/bundle/release/*.aab
            **/outputs/bundle/release/*.aab
