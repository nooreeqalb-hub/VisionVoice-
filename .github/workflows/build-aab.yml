name: Build Signed AAB and APK for Play Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Permission
        run: chmod +x gradlew

      - name: Generate Keystore for Release
        run: |
          keytool -genkey -v -keystore app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -storepass vision123 -keypass vision123 -alias visionvoice -dname "CN=VisionVoice, OU=Dev, O=Noor, L=Delhi, S=Delhi, C=IN"
          echo "storeFile=release-key.jks" > app/keystore.properties
          echo "storePassword=vision123" >> app/keystore.properties
          echo "keyAlias=visionvoice" >> app/keystore.properties
          echo "keyPassword=vision123" >> app/keystore.properties

      - name: Build Signed APK
        run: ./gradlew assembleRelease

      - name: Build Signed AAB for Play Store
        run: ./gradlew bundleRelease

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VisionVoice-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Signed AAB - PLAY STORE
        uses: actions/upload-artifact@v4
        with:
          name: VisionVoice-Release-AAB-FINAL
          path: app/build/outputs/bundle/release/*.aab
